version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: lt_db
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      MYSQL_DATABASE: lt_web
      MYSQL_USER: appuser
    ports:
      # Host-only access for database clients such as TablePlus.
      # Backend still connects to db:3306 inside the Docker network.
      - '127.0.0.1:3307:3306'
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app-network
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h localhost -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lt_backend
    restart: unless-stopped
    ports:
      - '4000:3000'
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: lt_web
      DB_USER: appuser
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/health']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    networks:
      - app-network
    volumes:
      - ./backend:/app
      - /app/node_modules

volumes:
  db_data:

networks:
  app-network:
    driver: bridge
